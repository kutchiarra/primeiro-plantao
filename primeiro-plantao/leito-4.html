<title>Leito 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">

<style>
:root{
  --papel:#FAF3F0; --papel-2:#F4E8E3; --mesa:#EADCD6; --fita:#FCF1EC;
  --linha:#E4D6D0; --linha-forte:#CDB8B0;
  --tinta:#191411; --tinta-2:#4C423C; --tinta-3:#74645C;
  --caneta:#1B3FA0; --caneta-fundo:#E8EDF9; --carimbo:#B8241C; --atencao:#8F5B12; --verde:#2C6A4A;
  --ui:'Archivo',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --voz:'Newsreader',Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mesa);color:var(--tinta);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--caneta);outline-offset:2px}
.tabular{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rotulo{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3);margin:0}
.carimbo{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--carimbo);border:1px solid var(--carimbo);padding:2px 7px;margin-bottom:10px}
.un{font-family:var(--mono);font-size:10px;color:var(--tinta-3);letter-spacing:.08em}
.vazio{color:var(--tinta-3);font-size:13.5px;margin:12px 2px}

.plantao{max-width:1340px;margin:0 auto;min-height:100vh;background:var(--papel);border-left:1px solid var(--linha-forte);border-right:1px solid var(--linha-forte);display:flex;flex-direction:column}
.plantao.critico{box-shadow:inset 0 3px 0 var(--carimbo)}

.papeleta{position:relative;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;padding:24px 30px 16px;border-bottom:3px double var(--linha-forte)}
.papeleta h1{font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0 0 4px}
.papeleta .linha{margin:0;font-size:12.5px;color:var(--tinta-2)}
.papeleta .queixa{margin:8px 0 0;font-family:var(--voz);font-size:17px;font-style:italic}
.campos{display:flex;margin:0}
.campos>div{padding:0 18px;border-left:1px solid var(--linha);text-align:right;min-width:138px}
.campos>div:first-child{border-left:none}
.campos dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3);margin-bottom:4px}
.campos dd{margin:0}
.campos .grande{font-size:24px;line-height:1.1;font-family:var(--mono);font-variant-numeric:tabular-nums}
.campos .nota{font-size:10.5px;color:var(--tinta-3);font-family:var(--mono);margin-top:3px}
.estado.atencao{color:var(--atencao)} .estado.crit{color:var(--carimbo)}

.mesa{display:grid;grid-template-columns:minmax(0,1fr) 470px;flex:1}
.coluna{padding:20px 30px 24px;display:flex;flex-direction:column;min-width:0}
.instr-col{border-left:1px solid var(--linha-forte);background:var(--papel-2);padding:20px 24px 24px}

.conversa{flex:1;overflow-y:auto;margin:10px 0 4px;display:flex;flex-direction:column;gap:13px;max-height:min(46vh,420px);min-height:200px;padding-right:4px}
.fala{display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;margin:0}
.fala .hora{font-family:var(--mono);font-size:10px;color:var(--tinta-3);padding-top:4px}
.fala p{margin:0}
.fala.paciente p{font-family:var(--voz);font-size:17px;line-height:1.5}
.fala.medico p{border-left:2px solid var(--caneta);padding-left:12px;color:var(--caneta)}
.fala.exame p,.fala.conduta p{font-family:var(--mono);font-size:12px;line-height:1.5;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:7px 0;color:var(--tinta-2)}
.fala.conduta p{color:var(--verde)}
.fala.alarme p{font-family:var(--mono);font-size:12px;color:var(--carimbo);border-left:2px solid var(--carimbo);padding-left:12px}

.atalhos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.atalho{background:none;border:1px solid var(--linha-forte);color:var(--caneta);font-size:12.5px;padding:5px 10px}
.atalho:hover{background:var(--caneta-fundo);border-color:var(--caneta)}
.pergunta{display:flex;margin-top:12px;border-bottom:1.5px solid var(--tinta)}
.pergunta input{flex:1;background:none;border:none;padding:10px 2px;font-size:15px;color:var(--caneta)}
.pergunta input:focus{outline:none}
.pergunta input::placeholder{color:var(--tinta-3)}
.pergunta button{background:var(--caneta);color:#fff;border:none;padding:9px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}

.manobras{margin-top:20px}
.mapa{display:grid;grid-template-columns:minmax(170px,236px) minmax(0,1fr);gap:20px;align-items:start;margin-top:10px}
.mapa svg{width:100%;max-width:236px;height:auto;display:block}
.pele{stroke:#6E482E;stroke-width:1.1;stroke-linejoin:round;stroke-opacity:.75}
.pele .tronco,.pele .cabeca,.pele .pescoco{fill:url(#pp-pele)}
.pele .membro-lavagem{fill:none;stroke:url(#pp-pele);stroke-width:17;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:1}
.anatomia{fill:none;stroke:var(--tinta);stroke-width:.9;stroke-opacity:.22;stroke-linecap:round}
.anatomia .alba{stroke-opacity:.16}
.anatomia .ecm{stroke-opacity:.18}
.anatomia .eixo{stroke-dasharray:2 4;stroke-opacity:.12}
.rosto{fill:none;stroke:var(--tinta);stroke-width:1.2;stroke-linecap:round;stroke-opacity:.55}
.rosto .cabelo{fill:#4A3A31;stroke:none;opacity:.85}
.avental{fill:url(#pp-avental);stroke:#9BAEBD;stroke-width:.9;opacity:.96}
.dobra{fill:none;stroke:#9BAEBD;stroke-width:.8;opacity:.5}
.focos{opacity:.4;transition:opacity .15s}
.mapa svg:has([data-m="cardio"]:hover) .focos,.mapa svg:has([data-m="cardio"]:focus-visible) .focos{opacity:1}
.focos circle{fill:var(--caneta)}
.focos text{font-family:var(--mono);font-size:8px;font-weight:500;fill:var(--caneta)}
.inspecao{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.inspecao li{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--carimbo);border:1px solid var(--carimbo);padding:2px 7px}
.ponto{cursor:pointer}
.area{fill:var(--caneta);fill-opacity:.07;stroke:var(--caneta);stroke-width:1;stroke-opacity:.55;transition:fill-opacity .15s,stroke-opacity .15s}
.ponto:hover .area,.ponto:focus-visible .area{fill-opacity:.2;stroke-opacity:1}
.ponto:focus-visible{outline:none}
.ponto:focus-visible .area{stroke-width:2.2}
.ponto.feita .area{stroke:var(--verde);fill:var(--verde)}
.tique{fill:none;stroke:var(--verde);stroke-width:1.8;stroke-linecap:round}
.mapa-lado{padding-top:4px}
.dica{margin:0 0 10px;font-size:13px;color:var(--tinta-3);line-height:1.45;min-height:62px}
.dica b{display:block;font-size:15.5px;color:var(--tinta);font-weight:600}
.dica i{display:block;font-style:normal;font-size:12.5px;color:var(--tinta-2);margin:1px 0 4px}
.dica em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--caneta)}
.ausculta{margin-top:10px;border:1px solid var(--linha-forte);background:var(--fita)}
.ausculta .topo{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--linha-forte);font-size:13px}
.ausculta canvas{display:block;width:100%}
.ausculta .achado{padding:8px 10px;margin:0;font-family:var(--mono);font-size:12px;color:var(--tinta-2);border-top:1px solid var(--linha)}

.instrumento{border:1px solid var(--linha-forte);background:var(--fita)}
.critico .instrumento{border-color:var(--carimbo)}
canvas.fita{display:block;width:100%}
.vitais{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border-top:1px solid var(--linha-forte)}
.vitais>div{padding:9px 6px 8px;border-left:1px solid var(--linha);text-align:center}
.vitais>div:nth-child(4n+1){border-left:none}
.vitais>div:nth-child(n+5){border-top:1px solid var(--linha)}
.vitais dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
.vitais dd{margin:2px 0 0;font-family:var(--mono);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.vitais dd.un{font-size:9.5px;margin-top:2px}
.vitais .fora dd{color:var(--carimbo);animation:pulsar 2.6s ease-in-out infinite}
@keyframes pulsar{0%,100%{opacity:1}50%{opacity:.45}}

.tendencia{border-top:1px solid var(--linha-forte)}
.tend-legenda{display:flex;align-items:center;gap:12px;padding:7px 10px 0}
.tend-legenda em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.08em}
.tend-legenda em::before{content:'';display:inline-block;width:10px;height:2px;background:currentColor;margin-right:5px;vertical-align:middle}
.tend-dica{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3)}
.tend-papel{position:relative}
.tend-papel canvas{display:block;width:100%}
.leitura{position:absolute;top:6px;pointer-events:none;background:var(--papel);border:1px solid var(--linha-forte);padding:6px 9px;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:10.5px;line-height:1.3;min-width:92px}
.leitura b{font-size:11px;color:var(--tinta-3);font-weight:500}
.leitura em{font-style:normal;color:#A8695A;font-size:9.5px;margin-top:2px}

.emacao{margin-top:16px}
.emacao .rotulo{display:block;border-top:1px solid var(--linha-forte);padding-top:12px;margin-bottom:6px}
.droga{border-top:1px solid var(--linha);padding:9px 0 10px}
.droga.fim{opacity:.45}
.droga header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.droga header b{font-size:13.5px}
.droga header span{font-family:var(--mono);font-size:10px;color:var(--tinta-3)}
.droga .barra{height:3px;background:var(--linha);margin:6px 0}
.droga .barra i{display:block;height:100%;background:var(--verde);transition:width .4s linear}
.droga .efeito{font-family:var(--mono);font-size:11px;color:var(--tinta-2);margin:0}
.droga .inter{margin:5px 0 0;font-family:var(--mono);font-size:10px;color:var(--carimbo);border-left:2px solid var(--carimbo);padding-left:8px}

.pedidos{margin-top:16px;display:flex;flex-direction:column;min-height:0}
.abas{display:flex;gap:18px;border-top:1px solid var(--linha-forte);border-bottom:1px solid var(--linha-forte);padding-top:12px}
.abas button{background:none;border:none;padding:0 0 9px;margin-bottom:-1px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3);border-bottom:2px solid transparent}
.abas button[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--tinta)}
.badge{display:inline-block;font-style:normal;background:var(--carimbo);color:#fff;border-radius:99px;padding:0 5px;margin-left:6px;font-size:9.5px}
.catalogo{list-style:none;margin:0;padding:0;overflow-y:auto;max-height:320px}
.catalogo li+li{border-top:1px solid var(--linha)}
.catalogo li.aberto{background:var(--papel)}
.catalogo>li>button{width:100%;background:none;border:none;padding:10px 2px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;align-items:baseline}
.catalogo>li>button:hover:not(:disabled){background:var(--caneta-fundo)}
.catalogo>li>button:disabled{cursor:default;color:var(--tinta-3)}
.cat-nome{font-size:14px}
.cat-meta{font-family:var(--mono);font-size:11px;color:var(--tinta-3);white-space:nowrap}
.cat-estado{grid-column:1/-1;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--caneta)}
.doses{padding:2px 4px 12px}
.doses p{margin:0 0 9px;font-size:12.5px;color:var(--tinta-2);line-height:1.45}
.doses div{display:flex;flex-wrap:wrap;gap:6px}
.doses button{background:var(--caneta);color:#fff;border:none;padding:7px 12px;font-family:var(--mono);font-size:12px;text-align:left}
.doses button em{display:block;font-style:normal;font-size:9px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}

.resultados{overflow-y:auto;max-height:340px;padding-top:4px}
.laudo{border:1px solid var(--linha-forte);background:var(--papel);padding:10px 12px;margin-top:10px;animation:entrar .28s ease-out}
.laudo.espera{border-style:dashed}
.laudo header{display:flex;align-items:baseline;gap:8px;font-size:13px}
.laudo header span:first-child{font-family:var(--mono);font-size:10px;color:var(--tinta-3)}
.laudo header b{flex:1;font-weight:500}
.laudo .texto{margin:8px 0 0;font-family:var(--mono);font-size:12px;line-height:1.55}
.laudo .abrir{margin-top:8px;background:none;border:1px solid var(--caneta);color:var(--caneta);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px}
.laudo .abrir:hover{background:var(--caneta);color:#fff}
.laudo .barra{height:2px;background:var(--linha);margin-top:9px}
.laudo .barra i{display:block;height:100%;background:var(--caneta);transition:width .5s linear}
.flag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:1px 6px;color:var(--tinta-3)}
.flag.critico,.flag.alto{color:var(--carimbo)} .flag.normal{color:var(--verde)}
canvas.ecg12{display:block;width:100%;margin-top:10px;border:1px solid var(--linha-forte)}

.rodape{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 30px;border-top:3px double var(--linha-forte);background:var(--papel);position:sticky;bottom:0}
.rodape p{margin:0;font-size:13px;color:var(--tinta-2)}
.critico .rodape p{color:var(--carimbo)}
.encerrar{background:var(--tinta);color:var(--papel);border:none;padding:11px 22px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.encerrar:hover{background:var(--caneta)}

.folha{position:fixed;inset:0;background:rgba(25,20,17,.5);display:grid;place-items:center;padding:24px;z-index:20}
.folha form{background:var(--papel);border:1px solid var(--linha-forte);padding:26px 28px;width:min(560px,100%);animation:entrar .22s ease-out}
.folha h2{font-size:21px;font-weight:600;margin:0 0 18px;letter-spacing:-.015em}
.folha label{display:block;margin-bottom:16px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3)}
.folha input,.folha textarea{display:block;width:100%;margin-top:7px;background:none;border:none;border-bottom:1.5px solid var(--tinta);padding:8px 2px;font-family:var(--ui);font-size:15px;letter-spacing:0;text-transform:none;color:var(--caneta);resize:vertical}
.folha .acoes{display:flex;gap:10px;justify-content:flex-end}
.folha .acoes button{background:var(--tinta);color:var(--papel);border:none;padding:11px 20px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.folha .acoes .sec{background:none;color:var(--tinta-2);border:1px solid var(--linha-forte)}

.debrief{max-width:940px;margin:0 auto;min-height:100vh;background:var(--papel);border-left:1px solid var(--linha-forte);border-right:1px solid var(--linha-forte);padding:34px 40px 60px}
.deb-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;border-bottom:3px double var(--linha-forte);padding-bottom:20px}
.deb-topo h1{font-size:24px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em;max-width:28ch}
.deb-topo .ref{margin:0;font-family:var(--mono);font-size:11px;color:var(--tinta-3)}
.deb-nota{text-align:right}
.deb-nota strong{display:block;font-family:var(--mono);font-size:52px;line-height:1;font-weight:500}
.pilares{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px;margin:26px 0 30px}
.pilar-cab{display:flex;justify-content:space-between;align-items:baseline}
.pilar-cab b{font-size:15px} .pilar-cab span{font-family:var(--mono);font-size:17px}
.pilar-cab i{font-style:normal;font-size:11px;color:var(--tinta-3)}
.regua{height:5px;background:var(--linha);margin:8px 0 7px}
.regua i{display:block;height:100%;background:var(--caneta)}
.pilar p{margin:0;font-size:12.5px;color:var(--tinta-3);line-height:1.4}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--linha-forte);border-bottom:1px solid var(--linha-forte)}
.numeros>div{padding:12px 16px;border-left:1px solid var(--linha)}
.numeros>div:first-child{border-left:none;padding-left:0}
.numeros b{display:block;font-family:var(--mono);font-size:19px;margin-top:3px}
.crono{margin-top:32px}
.crono .rotulo{display:block;padding-bottom:8px;border-bottom:1px solid var(--linha)}
.crono p{margin:12px 0 14px;font-size:13.5px;color:var(--tinta-3);max-width:74ch;line-height:1.5}
.crono__papel{position:relative;border:1px solid var(--linha-forte)}
.crono__papel canvas{display:block;width:100%}
.crono__leitura{position:absolute;top:6px;right:8px;pointer-events:none;background:var(--papel);
  border:1px solid var(--linha-forte);padding:4px 8px;font-family:var(--mono);font-size:10.5px;color:var(--tinta-2)}
.crono__leitura em{font-style:normal;color:var(--caneta);margin-left:8px}
.crono__legenda{list-style:none;display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 0;padding:0}
.crono__legenda li{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--tinta-3)}
.crono__legenda li::before{content:'';display:inline-block;width:9px;height:2px;margin-right:6px;
  vertical-align:middle;background:currentColor}
.crono__legenda .lg-azul{color:var(--caneta)}
.crono__legenda .lg-tinta{color:var(--tinta)}
.crono__legenda .lg-verde{color:var(--verde)}
.crono__legenda .lg-vermelho{color:var(--carimbo)}
.achados{margin-top:30px}
.achados ol{list-style:none;margin:14px 0 0;padding:0}
.achado{border-top:1px solid var(--linha);padding:16px 0 16px 16px;border-left:2px solid var(--linha-forte)}
.achado.critico{border-left-color:var(--carimbo)} .achado.importante{border-left-color:var(--atencao)}
.achado .tags{display:flex;gap:8px;margin-bottom:5px}
.achado .tags span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
.achado.critico .sev{color:var(--carimbo)} .achado.importante .sev{color:var(--atencao)}
.achado b{display:block;font-size:15.5px}
.achado p{margin:4px 0 0;font-size:14.5px;color:var(--tinta-2);max-width:70ch}
.deb-rodape{margin-top:40px;padding-top:18px;border-top:3px double var(--linha-forte);display:flex;justify-content:space-between;align-items:center;gap:24px}
.deb-rodape p{margin:0;font-size:12.5px;color:var(--tinta-3);max-width:62ch}
.deb-rodape button{background:var(--tinta);color:var(--papel);border:none;padding:11px 20px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}

@keyframes entrar{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1040px){
  .mesa{grid-template-columns:1fr}
  .instr-col{border-left:none;border-top:1px solid var(--linha-forte)}
  .papeleta{grid-template-columns:1fr;align-items:start;gap:16px}
  .campos>div{text-align:left;padding-left:0;padding-right:18px;border-left:none;border-right:1px solid var(--linha)}
  .campos>div:last-child{border-right:none}
  .conversa{max-height:none}
  .debrief{padding:26px 20px 50px}
}

  if (dt < pd.i || dt >= pd.d) return 0;

  else ach.push({pilar:'Soft skills',sev:'refinamento',t:'Falou em jargão com a paciente',d:'Ela tem fundamental incompleto. Termo técnico vira silêncio, não vira informação.'});
  soft = Math.min(15,soft);

  const acertou = GABARITO.aceita.test(hipotese||'');
  if (!acertou) ach.push({pilar:'Conduta',sev:'critico',t:'Hipótese principal não bate com o caso',d:'Diagnóstico do caso: '+GABARITO.dx+'.'});

  const ordem = {critico:0,importante:1,refinamento:2};
  ach.sort((a,b)=>ordem[a.sev]-ordem[b.sev]);
  const chave = E.doses.find(a=>a.id===GABARITO.chave);
  const metas=[];
  EXAMES.forEach(e=>{ if(!e.meta) return; const ped=E.pedidos.find(x=>x.id===e.id);
    metas.push({t:e.meta,rotulo:e.nome.split(' ')[0],feitoEm:ped?ped.minuto:null}); });
  const fChave=FARMACOS.find(f=>f.id===GABARITO.chave);
  if (fChave&&fChave.janela) metas.push({t:fChave.janela,rotulo:'porta-balão',
    feitoEm:chave?chave.minuto:null});
  const linha={
    perguntas:E.msgs.filter(m=>m.de==='medico').map(m=>m.min),
    exame:E.msgs.filter(m=>m.de==='exame').map(m=>m.min),
    exames:E.pedidos.map(p=>{const e=EXAMES.find(x=>x.id===p.id);
      return {nome:e.nome,minuto:p.minuto,prontoEm:p.prontoEm,visto:p.visto,
              indicado:!!(e.indicado||e.aceitavel)};}),
    condutas:E.doses.map(a=>{const f=FARMACOS.find(x=>x.id===a.id);
      return {nome:f.nome,minuto:a.minuto,classe:f.classif};}),
    historico:E.hist, metas
  };
  return {linha,anamnese,investigacao,conduta,soft,total:anamnese+investigacao+conduta+soft,
    ach,acertou,minutoChave:chave?chave.minuto:null,custo:custo(),min:min(),
    manobras:E.manobras.length,hipotese};
}

// ECG — morfologia PQRST com supra de ST
// ===========================================================================
function amplitude(f,supra){
  if (f<0.08) return 0;
  if (f<0.18) return 0.14*Math.sin((f-0.08)/0.1*Math.PI);
  if (f<0.225) return 0;
  if (f<0.245) return -0.09*((f-0.225)/0.02);
  if (f<0.265) return -0.09+1.35*((f-0.245)/0.02);
  if (f<0.295) return 1.26-1.55*((f-0.265)/0.03);
  if (f<0.34) return -0.29+(0.29+supra)*((f-0.295)/0.045);
  if (f<0.44) return supra;
  if (f<0.66) return supra+0.34*Math.sin((f-0.44)/0.22*Math.PI);
  return 0;
}

const MM=4, PXS=25*MM, HZ=PXS, ALT=160, SUPRA=0.26;
let buffer=[], fase=0, passo=0;

function fitaQuadro(quadros){
  const cv = document.getElementById('fita'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const larg = cv.parentElement.clientWidth||600, dpr = devicePixelRatio||1;
  if (cv.width !== Math.round(larg*dpr)){
    cv.width=Math.round(larg*dpr); cv.height=Math.round(ALT*dpr);
    cv.style.width=larg+'px'; cv.style.height=ALT+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  const {v} = estado(tMin());
  for (let n=0;n<quadros;n++){
    fase += 1/HZ/(60/Math.max(30,v.fc)); if(fase>=1) fase-=1;
    buffer.push(amplitude(fase,SUPRA)+Math.sin(passo/260)*0.02+(Math.random()-0.5)*0.012);
    passo++; if(buffer.length>3000) buffer.shift();
  }
  const meio = ALT*0.62, off = passo%(5*MM);
  ctx.fillStyle='#FCF1EC'; ctx.fillRect(0,0,larg,ALT);
  ctx.lineWidth=1; ctx.strokeStyle='#F3DAD2'; ctx.beginPath();
  for(let x=-off;x<larg;x+=MM){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,ALT);}
  for(let y=0;y<ALT;y+=MM){ctx.moveTo(0,y+.5);ctx.lineTo(larg,y+.5);}
  ctx.stroke();
  ctx.strokeStyle='#E3A797'; ctx.beginPath();
  for(let x=-off;x<larg;x+=5*MM){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,ALT);}
  for(let y=ALT%(5*MM);y<ALT;y+=5*MM){ctx.moveTo(0,y+.5);ctx.lineTo(larg,y+.5);}
  ctx.stroke();
  const vis = Math.min(buffer.length,Math.floor(larg));
  ctx.strokeStyle='#17110E'; ctx.lineWidth=1.7; ctx.lineJoin='round'; ctx.beginPath();
  for(let i=0;i<vis;i++){ const val=buffer[buffer.length-vis+i], x=larg-vis+i, y=meio-val*10*MM;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.stroke();
  const ult = meio-(buffer[buffer.length-1]||0)*10*MM;
  ctx.fillStyle='#17110E'; ctx.beginPath();
  ctx.moveTo(larg,ult-5); ctx.lineTo(larg,ult+5); ctx.lineTo(larg-7,ult); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#B0776A'; ctx.font='500 10px "IBM Plex Mono",monospace';
  ctx.fillText('II   25 mm/s   10 mm/mV',10,16);
}
// Em aba oculta o navegador não chama requestAnimationFrame; o primeiro quadro
// é desenhado à mão para o papel nunca aparecer em branco na volta.
function fitaLoop(){ fitaQuadro(Math.round(HZ/60)); requestAnimationFrame(fitaLoop); }

const DER = [
 [{n:'I',a:.62,s:-.35},{n:'aVR',a:-.48,s:-.4},{n:'V1',a:.45,s:.02},{n:'V4',a:1.1,s:0}],
 [{n:'II',a:1,s:1},{n:'aVL',a:-.34,s:-.5},{n:'V2',a:.9,s:.05},{n:'V5',a:.85,s:.02}],
 [{n:'III',a:.88,s:1.05},{n:'aVF',a:.95,s:1},{n:'V3',a:1,s:.05},{n:'V6',a:.6,s:.02}]
];

function desenharECG12(cv,fc,minuto){
  const ctx=cv.getContext('2d'), dpr=devicePixelRatio||1, mm=3.2;
  const larg=cv.parentElement.clientWidth||420, alturaLinha=24*mm, alt=alturaLinha*3+30*mm+26;
  cv.width=Math.round(larg*dpr); cv.height=Math.round(alt*dpr);
  cv.style.width=larg+'px'; cv.style.height=alt+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#FCF1EC'; ctx.fillRect(0,0,larg,alt);
  ctx.lineWidth=1; ctx.strokeStyle='#F3DAD2'; ctx.beginPath();
  for(let x=0;x<larg;x+=mm){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,alt);}
  for(let y=0;y<alt;y+=mm){ctx.moveTo(0,y+.5);ctx.lineTo(larg,y+.5);}
  ctx.stroke();
  ctx.strokeStyle='#E7B4A5'; ctx.beginPath();
  for(let x=0;x<larg;x+=5*mm){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,alt);}
  for(let y=0;y<alt;y+=5*mm){ctx.moveTo(0,y+.5);ctx.lineTo(larg,y+.5);}
  ctx.stroke();
  const rr=60/Math.max(30,fc), col=(larg-8)/4;
  const traco=(d,x0,y0,w,seg,desl)=>{
    ctx.strokeStyle='#17110E'; ctx.lineWidth=1.4; ctx.beginPath();
    const passos=Math.floor(w);
    for(let i=0;i<passos;i++){ const t=desl+(i/passos)*seg, f=(t%rr)/rr;
      const y=y0-amplitude(f,SUPRA*d.s)*d.a*10*mm; i?ctx.lineTo(x0+i,y):ctx.moveTo(x0+i,y); }
    ctx.stroke();
    ctx.fillStyle='#17110E'; ctx.font='600 10px "IBM Plex Mono",monospace';
    ctx.fillText(d.n,x0+4,y0-9*mm);
  };
  DER.forEach((linha,l)=>{ const y=26+alturaLinha*l+alturaLinha*0.55;
    linha.forEach((d,c)=>{ traco(d,4+col*c,y,col-6,2.4,c*2.4);
      if(c){ ctx.strokeStyle='#D9A492'; ctx.beginPath();
        ctx.moveTo(4+col*c-3,y-8*mm); ctx.lineTo(4+col*c-3,y+8*mm); ctx.stroke(); }});});
  traco({n:'II · ritmo',a:1,s:1},4,26+alturaLinha*3+14*mm,larg-12,9.6,0);
  ctx.fillStyle='#A8695A'; ctx.font='500 9.5px "IBM Plex Mono",monospace';
  ctx.fillText(P.nome+'   FC '+fc+' bpm   25 mm/s   10 mm/mV   minuto '+minuto,5,14);
}

const FAIXAS={fc:{min:40,max:190,cor:'#17110E'},pas:{min:40,max:220,cor:'#1B3FA0'},spo2:{min:70,max:100,cor:'#2C6A4A'}};
let leitura=null, escala={ini:0,fim:30,larg:400};

// Registrador multicanal: uma faixa por parâmetro, escala própria, marcas de
// injeção atravessando as três. Três escalas no mesmo quadro só confundem.
const ORDEM=['fc','pas','spo2'], ROTULOS={fc:'FC',pas:'PAS',spo2:'SpO₂'}, FBANDA=42;

function desenharTendencia(){
  const cv=document.getElementById('tend'); if(!cv) return;
  const ctx=cv.getContext('2d'), dpr=devicePixelRatio||1;
  const ALTT=ORDEM.length*FBANDA+18, larg=cv.parentElement.clientWidth||400;
  cv.width=Math.round(larg*dpr); cv.height=Math.round(ALTT*dpr);
  cv.style.width=larg+'px'; cv.style.height=ALTT+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
  const fim=Math.max(30,E.hist.length?E.hist[E.hist.length-1].t:0), ini=Math.max(0,fim-30);
  escala={ini,fim,larg};
  const x=t=>((t-ini)/Math.max(.1,fim-ini))*(larg-46)+42;
  ctx.fillStyle='#FCF1EC'; ctx.fillRect(0,0,larg,ALTT);
  const pts=E.hist.filter(p=>p.t>=ini);

  ORDEM.forEach((k,i)=>{
    const fx=FAIXAS[k], topo=8+i*FBANDA, base=topo+FBANDA-14;
    const y=val=>base-((val-fx.min)/(fx.max-fx.min))*(base-topo);
    ctx.strokeStyle='#F0D3CB'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(42,base+.5); ctx.lineTo(larg-4,base+.5);
    ctx.moveTo(42,topo+.5); ctx.lineTo(larg-4,topo+.5); ctx.stroke();
    ctx.fillStyle=fx.cor; ctx.font='500 9.5px "IBM Plex Mono",monospace';
    ctx.fillText(ROTULOS[k],4,topo+11);
    if (pts.length){ ctx.fillStyle='#8C7C74'; ctx.font='500 8.5px "IBM Plex Mono",monospace';
      ctx.fillText(fx.max,4,topo+22); ctx.fillText(fx.min,4,base); }
    if (pts.length>1){
      ctx.strokeStyle=fx.cor; ctx.lineWidth=1.5; ctx.beginPath();
      pts.forEach((p,j)=>{ const px=x(p.t), py=y(p[k]); j?ctx.lineTo(px,py):ctx.moveTo(px,py); });
      ctx.stroke();
      const u=pts[pts.length-1];
      ctx.fillStyle=fx.cor; ctx.beginPath(); ctx.arc(x(u.t),y(u[k]),2.6,0,7); ctx.fill();
      ctx.font='500 11px "IBM Plex Mono",monospace';
      ctx.fillText(u[k],Math.min(x(u.t)+6,larg-30),y(u[k])-5);
    }
    if (leitura){ ctx.fillStyle=fx.cor; ctx.beginPath(); ctx.arc(x(leitura.t),y(leitura[k]),3.2,0,7); ctx.fill();
      ctx.strokeStyle='#FCF1EC'; ctx.lineWidth=1; ctx.stroke(); }
  });

  const alturaTotal=ORDEM.length*FBANDA;
  ctx.font='500 9px "IBM Plex Mono",monospace';
  E.doses.forEach(a=>{ if(a.minuto<ini) return; const px=x(a.minuto);
    ctx.strokeStyle='#C08A7C'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(px,4); ctx.lineTo(px,alturaTotal); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#A8695A';
    ctx.fillText(FARMACOS.find(f=>f.id===a.id).nome.split(' ')[0],Math.min(px+3,larg-46),alturaTotal+9); });
  if (leitura){ const px=x(leitura.t);
    ctx.strokeStyle='#8C7C74'; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(px,4); ctx.lineTo(px,alturaTotal); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle='#B0776A'; ctx.font='500 9px "IBM Plex Mono",monospace';
  ctx.fillText(Math.round(ini)+'′',42,ALTT-3); ctx.fillText(Math.round(fim)+'′',larg-26,ALTT-3);
}

let ac=null, noAtual=null, ganhoAtual=null, mudo=false;
const pegarAC = () => { if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
  if (ac.state==='suspended') ac.resume(); return ac; };

function thud(ctx,dest,t,freq,dur,pico){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(pico,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t+dur+.02);
}

function pararAusculta(){ if(noAtual){noAtual.parar();noAtual=null;} if(ganhoAtual){ganhoAtual.disconnect();ganhoAtual=null;} }

function iniciarAusculta(tipo){
  pararAusculta(); const ctx=pegarAC();
  ganhoAtual=ctx.createGain(); ganhoAtual.gain.value=mudo?0:1; ganhoAtual.connect(ctx.destination);
  let prox=ctx.currentTime+.05, ativo=true, ruido=null, filtro=null, env=null;
  if (tipo==='pulmao'){
    const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    ruido=ctx.createBufferSource(); ruido.buffer=buf; ruido.loop=true;
    filtro=ctx.createBiquadFilter(); filtro.type='bandpass';
    env=ctx.createGain(); env.gain.value=0;
    ruido.connect(filtro).connect(env).connect(ganhoAtual); ruido.start();
  }
  const id=setInterval(()=>{ if(!ativo||document.hidden) return;
    const {v}=estado(tMin());
    while(prox<ctx.currentTime+.12){
      if (tipo==='coracao'){ thud(ctx,ganhoAtual,prox,65,.09,.85); thud(ctx,ganhoAtual,prox+.16,48,.07,.5);
        prox += 60/Math.max(30,v.fc);
      } else { const ciclo=60/Math.max(6,v.fr), insp=ciclo*.4, expp=ciclo*.6;
        const grav=Math.max(0,Math.min(1,(94-v.spo2)/15));
        filtro.frequency.setValueAtTime(300,prox); filtro.Q.setValueAtTime(.6,prox);
        env.gain.setValueAtTime(.0001,prox);
        env.gain.linearRampToValueAtTime(.10*(.4+.6*grav),prox+insp*.3);
        env.gain.linearRampToValueAtTime(.0001,prox+insp);
        env.gain.linearRampToValueAtTime(.05*(.4+.6*grav),prox+insp+expp*.3);
        env.gain.linearRampToValueAtTime(.0001,prox+ciclo);
        prox += ciclo; }
    }},25);
  noAtual={parar:()=>{ativo=false;clearInterval(id); if(ruido){try{ruido.stop();}catch(e){}}}};
}

let fasePulso=0;
function desenharAusculta(){
  const cv=document.getElementById('ausc'); if(!cv||!E.painel) return;
  const ctx=cv.getContext('2d'), dpr=devicePixelRatio||1, A=90;
  const larg=cv.parentElement.clientWidth||360;
  if (cv.width!==Math.round(larg*dpr)){ cv.width=Math.round(larg*dpr); cv.height=Math.round(A*dpr);
    cv.style.width=larg+'px'; cv.style.height=A+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
  const {v}=estado(tMin());
  ctx.fillStyle='#FCF1EC'; ctx.fillRect(0,0,larg,A);
  ctx.strokeStyle='#17110E'; ctx.lineWidth=1.6; ctx.beginPath();
  const meio=A/2;
  for(let x=0;x<larg;x++){
    let y;
    if (E.painel.tipo==='pulso'){ const rr=60/Math.max(30,v.fc), amp=v.pas<90?6:16;
      const f=(((x/larg)*6+fasePulso)%rr)/rr;
      y=meio-Math.pow(Math.max(0,Math.sin(f*Math.PI)),3)*amp;
    } else if (E.painel.tipo==='coracao'){ const rr=60/Math.max(30,v.fc);
      const f=(((x/larg)*4+fasePulso)%rr)/rr;
      const b=(f<.06?Math.sin(f/.06*Math.PI)*1:0)+(f>.2&&f<.26?Math.sin((f-.2)/.06*Math.PI)*.6:0);
      y=meio-b*22;
    } else { y=meio+Math.sin((x/larg)*10*Math.PI+fasePulso*6)*Math.max(2,10-Math.abs(Math.sin(fasePulso))*4); }
    x?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();
}

// A figura e desenhada uma vez; cada tique so atualiza opacidade e o tique da
// manobra feita. Trocar innerHTML sob o cursor mataria o hover.
function atualizarFigura(v){
  const lim=(x,a,b)=>Math.max(a,Math.min(b,x));
  const palidez=lim((105-v.pas)/45,0,1)*0.55;
  const cianose=lim((93-v.spo2)/12,0,1);
  const suor=lim(Math.max((v.dor-5)/5,(105-v.pas)/45,SINAIS_DO_CASO.includes('sudorese')?0.4:0),0,1)*0.9;
  const urt=SINAIS_DO_CASO.includes('urticaria')?0.9:0;
  const set=(id,op)=>{const el=document.getElementById(id); if(el) el.setAttribute('opacity',op);};
  set('pp-palidez',palidez); set('pp-cianose',cianose>0.2?cianose*0.7:0);
  set('pp-suor',suor>0.1?suor:0); set('pp-urticaria',urt);
  const boca=document.getElementById('pp-boca');
  if (boca) boca.style.stroke = cianose>0.25 ? '#5C6E9E' : '';
  MANOBRAS.forEach(m=>{ const g=document.querySelector('.ponto[data-m="'+m.id+'"]'); if(!g) return;
    const reg=REGIOES[m.regiao], feita=E.manobras.includes(m.id);
    g.classList.toggle('feita',feita);
    const t=g.querySelector('.tique');
    if (t && reg){ const p0=reg.formas[0];
      t.setAttribute('d','M'+(p0.cx+p0.rx-9)+' '+(p0.cy-p0.ry+4)+' l3.5 3.5 l7 -8');
      t.style.display = feita ? '' : 'none'; }
  });
  const cx=document.getElementById('inspecao');
  if (cx){ const itens=[];
    if(palidez>0.15) itens.push('p\u00e1lida');
    if(suor>0.3) itens.push('sudoreica');
    if(cianose>0.25) itens.push('cianose de extremidades');
    if(urt) itens.push('urtic\u00e1ria generalizada');
    cx.innerHTML = itens.map(i=>'<li>'+i+'</li>').join('');
  }
}

  document.querySelector('.plantao').className='plantao '+nivel;

  document.getElementById('relogio').textContent=rel(E.t);
  document.getElementById('gasto').textContent=real(custo());

     + '</p>'+(a.motivo&&a.amp!==1?'<p class="inter">efeito amplificado ×'+a.amp+' — '+esc(a.motivo)+'</p>':'')

  document.querySelectorAll('.abas button').forEach(b=>b.setAttribute('aria-selected',b.dataset.aba===E.aba));

  document.getElementById('aviso').textContent = nivel==='critico' ? 'A paciente está instável.'

function ligarEventos(){
  const raiz=document.getElementById('raiz');
  raiz.addEventListener('click',ev=>{
    const alvo=ev.target.closest('[data-pergunta],[data-farmaco],[data-inj],[data-exame],[data-abrir],[data-aba],[data-m],#encerrar');
    if(!alvo) return;
    if (alvo.dataset.pergunta!==undefined && alvo.dataset.pergunta) return perguntar(alvo.dataset.pergunta);
    if (alvo.dataset.m){ const m=MANOBRAS.find(x=>x.id===alvo.dataset.m);
      examinar(m); if(m.tipo==='coracao'||m.tipo==='pulmao') iniciarAusculta(m.tipo); else pararAusculta(); return; }
    if (alvo.dataset.inj){ const f=FARMACOS.find(x=>x.id===alvo.dataset.inj); return injetar(f,f.doses[+alvo.dataset.i]); }
    if (alvo.dataset.farmaco){ E.doseAberta = E.doseAberta===alvo.dataset.farmaco?null:alvo.dataset.farmaco; return pintar(); }
    if (alvo.dataset.exame) return pedir(EXAMES.find(x=>x.id===alvo.dataset.exame));
    if (alvo.dataset.abrir){ const p=E.pedidos.find(x=>x.id===alvo.dataset.abrir); p.visto=true; return pintar(); }
    if (alvo.dataset.aba){ E.aba=alvo.dataset.aba; return pintar(); }
    if (alvo.id==='encerrar') return abrirFechamento();
  });
  raiz.addEventListener('keydown',ev=>{
    const g=ev.target.closest('.ponto');
    if (g && (ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); g.click(); }
  });
  raiz.addEventListener('mouseover',ev=>{
    const g=ev.target.closest('.ponto'); const d=document.getElementById('dica'); if(!g||!d) return;
    const m=MANOBRAS.find(x=>x.id===g.dataset.m), reg=REGIOES[m.regiao];
    d.innerHTML='<b>'+esc(m.nome)+'</b><i>'+esc(reg.nome+(reg.det?' · '+reg.det:''))+'</i><em>'
      +(E.manobras.includes(m.id)?'reavaliar · 20 s':'1 min do plantão')+'</em>';
  });
  raiz.addEventListener('mouseout',ev=>{
    if (ev.target.closest('.ponto')){ const d=document.getElementById('dica');
      if(d) d.textContent='Clique numa região para examinar. Ausculta e pulso podem ser repetidos — o som segue os sinais vitais ao vivo.'; }
  });
  document.getElementById('form').addEventListener('submit',ev=>{
    ev.preventDefault(); const i=document.getElementById('entrada'); perguntar(i.value); i.value='';
  });
  const papel=document.getElementById('tend-papel');
  papel.addEventListener('mousemove',ev=>{
    if(!E.hist.length) return;
    const cx=papel.getBoundingClientRect();
    const t=escala.ini+((ev.clientX-cx.left-42)/Math.max(1,escala.larg-46))*(escala.fim-escala.ini);
    let perto=E.hist[0];
    E.hist.forEach(p=>{ if(Math.abs(p.t-t)<Math.abs(perto.t-t)) perto=p; });
    leitura=perto; desenharTendencia();
    const px=((perto.t-escala.ini)/Math.max(.1,escala.fim-escala.ini))*(escala.larg-46)+42;
    let cai=papel.querySelector('.leitura');
    if(!cai){ cai=document.createElement('div'); cai.className='leitura'; papel.appendChild(cai); }
    const dose=E.doses.filter(a=>Math.abs(a.minuto-perto.t)<.6)
      .map(a=>FARMACOS.find(f=>f.id===a.id).nome.split(' ')[0]);
    cai.innerHTML='<b>'+Math.round(perto.t)+'′</b><span style="color:#17110E">FC '+perto.fc
      +'</span><span style="color:#1B3FA0">PAS '+perto.pas+'</span><span style="color:#2C6A4A">SpO₂ '
      +perto.spo2+'</span>'+(dose.length?'<em>'+dose.join(', ')+'</em>':'');
    cai.style.left=Math.min(Math.max(px,4),escala.larg-124)+'px';
  });
  papel.addEventListener('mouseleave',()=>{ leitura=null; const c=papel.querySelector('.leitura');
    if(c) c.remove(); desenharTendencia(); });
}

const PILARES=[['anamnese','Anamnese',25,'temas que a paciente chegou a contar'],
  ['investigacao','Investigação',25,'acertos menos desperdício, por custo'],
  ['conduta','Conduta',35,'o que foi feito, e em quanto tempo'],
  ['soft','Soft skills',15,'apresentação, linguagem, explicação']];
const SEV={critico:'Crítico',importante:'Importante',refinamento:'Refinamento'};


// ===========================================================================
// LINHA DO TEMPO DO ATENDIMENTO
// O que a lista de achados nao mostra: o eixo em que o caso aconteceu.
// Cada marca e um dado. Nada aqui e ornamento.
// ===========================================================================
const CRONO_REG=['perguntas','exame físico','exames','condutas','PA sistólica'];
const CRONO_ALT=34, CRONO_TOPO=26, CRONO_RAIL=78;
let cronoEscala={x0:CRONO_RAIL,larg:400,tMax:1};

function desenharCrono(leitura){
  const cv=document.getElementById('crono'); if(!cv||!E.fim) return;
  const linha=E.fim.linha, ctx=cv.getContext('2d'), dpr=devicePixelRatio||1;
  const largura=cv.parentElement.clientWidth||640;
  const altura=CRONO_TOPO+CRONO_REG.length*CRONO_ALT+26;
  cv.width=Math.round(largura*dpr); cv.height=Math.round(altura*dpr);
  cv.style.width=largura+'px'; cv.style.height=altura+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const x0=CRONO_RAIL, x1=largura-10;
  const tMax=Math.max(E.fim.min,10,...linha.metas.map(m=>m.t));
  cronoEscala={x0,larg:x1-x0,tMax};
  const X=t=>x0+((x1-x0)*t)/tMax, base=i=>CRONO_TOPO+i*CRONO_ALT+CRONO_ALT-10;

  ctx.fillStyle='#FCF1EC'; ctx.fillRect(0,0,largura,altura);
  ctx.lineWidth=1;
  [['#F3DAD2',4],['#E7B4A5',20]].forEach(([cor,passo])=>{
    ctx.strokeStyle=cor; ctx.beginPath();
    for(let x=x0;x<=x1;x+=passo){ctx.moveTo(x+.5,CRONO_TOPO-8);ctx.lineTo(x+.5,altura-22);}
    for(let y=CRONO_TOPO-8;y<=altura-22;y+=passo){ctx.moveTo(x0,y+.5);ctx.lineTo(x1,y+.5);}
    ctx.stroke();});

  ctx.font='500 9px "IBM Plex Mono",monospace';
  linha.metas.forEach(m=>{ const px=X(m.t);
    const estourou = m.feitoEm==null || m.feitoEm>m.t;
    ctx.strokeStyle=estourou?'#B8241C':'#2C6A4A'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(px,CRONO_TOPO-8); ctx.lineTo(px,altura-22); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle=estourou?'#B8241C':'#2C6A4A';
    ctx.fillText(m.rotulo,Math.min(px+3,largura-66),CRONO_TOPO-12); });

  CRONO_REG.forEach((r,i)=>{ const y=base(i);
    ctx.strokeStyle='#D9C3B9'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0,y+.5); ctx.lineTo(x1,y+.5); ctx.stroke();
    ctx.fillStyle='#74645C'; ctx.font='500 9px "IBM Plex Mono",monospace';
    ctx.fillText(r,4,y); });

  const tique=(i,t,cor,alt,larg)=>{ const y=base(i),px=X(t);
    ctx.strokeStyle=cor; ctx.lineWidth=larg;
    ctx.beginPath(); ctx.moveTo(px,y); ctx.lineTo(px,y-alt); ctx.stroke(); };

  linha.perguntas.forEach(t=>tique(0,t,'#1B3FA0',14,1));
  linha.exame.forEach(t=>tique(1,t,'#17110E',14,1));

  const yEx=base(2);
  linha.exames.forEach(p=>{ const a=X(p.minuto), b=X(Math.min(p.prontoEm,tMax));
    ctx.fillStyle=p.visto?'#17110E':'#FCF1EC';
    ctx.strokeStyle=p.indicado?'#17110E':'#B8241C';
    ctx.lineWidth=1.3; ctx.setLineDash(p.visto?[]:[3,2]);
    ctx.beginPath(); ctx.rect(a,yEx-13,Math.max(4,b-a),9); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]); });

  linha.condutas.forEach(c=>tique(3,c.minuto,
    c.classe==='contraindicado'?'#B8241C':c.classe==='esperado'?'#2C6A4A':'#17110E',16,1.4));

  const yP=base(4), pas=linha.historico.filter(p=>p.pas);
  if (pas.length>1){ ctx.strokeStyle='#1B3FA0'; ctx.lineWidth=1.3; ctx.beginPath();
    pas.forEach((p,i)=>{ const px=X(Math.min(p.t,tMax)), py=yP-((p.pas-50)/150)*22;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    ctx.stroke(); }

  ctx.fillStyle='#B0776A'; ctx.font='500 9px "IBM Plex Mono",monospace';
  ctx.fillText('0\u2032',x0,altura-8); ctx.fillText(Math.round(tMax)+'\u2032',x1-22,altura-8);

  if (leitura!=null){ const px=X(leitura);
    ctx.strokeStyle='#74645C'; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(px,CRONO_TOPO-8); ctx.lineTo(px,altura-22); ctx.stroke();
    ctx.setLineDash([]); }
}

function ligarCrono(){
  const papel=document.getElementById('crono-papel'); if(!papel) return;
  papel.addEventListener('mousemove',ev=>{
    const cx=papel.getBoundingClientRect();
    const {x0,larg,tMax}=cronoEscala;
    const t=Math.max(0,Math.min(tMax,((ev.clientX-cx.left-x0)/Math.max(1,larg))*tMax));
    desenharCrono(t);
    const perto=[...E.fim.linha.condutas,...E.fim.linha.exames]
      .filter(o=>Math.abs(o.minuto-t)<0.8).map(o=>o.nome);
    let cai=papel.querySelector('.crono__leitura');
    if(!cai){cai=document.createElement('div');cai.className='crono__leitura';papel.appendChild(cai);}
    cai.innerHTML=Math.round(t)+'\u2032'+(perto.length?'<em>'+perto.join(' \u00b7 ')+'</em>':'');
  });
  papel.addEventListener('mouseleave',()=>{ desenharCrono(null);
    const c=papel.querySelector('.crono__leitura'); if(c) c.remove(); });
  window.addEventListener('resize',()=>desenharCrono(null));
}

setInterval(()=>{
  if (E.fim) return;
  E.t += ACEL/2;
  const {v}=estado(tMin());
  E.hist.push({t:tMin(),fc:v.fc,pas:v.pas,spo2:v.spo2});
  if (E.hist.length>500) E.hist.shift();
  const nivel=gravidade(v);
  if (nivel!==E.gravAnt){
    const antes=E.gravAnt; E.gravAnt=nivel;
    if (nivel==='critico'){
      registrar('alarme','Alarme: PA '+v.pas+'/'+v.pad+', FC '+v.fc+', SpO₂ '+v.spo2+'%. Célia fica pálida e sonolenta.');
      registrar('paciente','*voz arrastada* Doutor... tá tudo rodando...');
    } else if (nivel==='estavel'&&antes==='critico'){
      registrar('alarme','Estabilizou: PA '+v.pas+'/'+v.pad+', FC '+v.fc+', SpO₂ '+v.spo2+'%.');
    }
  }
  pintar();
},500);

setInterval(()=>{ fasePulso+=0.02; desenharAusculta(); },33);

pintar(); pintarConversa();
})();
